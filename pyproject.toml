[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engineering"
version = "0.1.0"
description = "Runnable companions to the Inference Engineering curriculum: the arithmetic behind how LLMs run on GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akbar Arif" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
export = ["pillow>=10"]  # tools/export_diagrams.py
blog = ["matplotlib>=3.7"]  # tools/make_blog_charts.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
